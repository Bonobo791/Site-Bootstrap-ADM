name: Check toolkit
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  template:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm install --global npm@11.9.0 --ignore-scripts
      - run: node scripts/check.mjs
      - run: node scripts/test-toolkit.mjs
      - name: Build production image
        run: docker build --build-arg SITE_URL=https://example.com --build-arg SOURCE_COMMIT=${{ github.sha }} -t site-toolkit skills/site-bootstrap-adm/assets/site
      - name: Check container
        run: |
          docker run -d --name site-toolkit --read-only --tmpfs /tmp -p 127.0.0.1:4330:4321 site-toolkit
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 20 --max-time 5 http://127.0.0.1:4330/healthz
          curl --fail http://127.0.0.1:4330/ | grep -q 'Site template'
          curl --fail http://127.0.0.1:4330/build.json | grep -q '${{ github.sha }}'
